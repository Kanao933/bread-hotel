.list-note{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px;line-height:1.7;margin:10px 0}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #d9cfbf;border-radius:8px;font:inherit;font-size:16px;resize:vertical}textarea:focus-visible{outline:3px solid #d8a36d;outline-offset:3px}.total{background:#e7eddf;color:#344c32;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;line-height:1.6}.item-options{flex-wrap:wrap}.choices{flex-basis:100%}.quantity{flex:1}.item-price{margin-top:3px}input.item-qty{text-align:left}.purchase-summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}.purchase-summary .total{margin:0}.complete-button{background:transparent;color:var(--muted);border:1px solid var(--line)}.complete-badge{background:#fff0ac;color:#705511;border:1px solid #e4c65d}.complete-button[aria-pressed="true"]{color:#705511;background:#f6d85f;border-color:#b99826;font-weight:700}.complete-badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:12px}button:disabled{opacity:.65;cursor:default}.checkin-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}#checkInDialog p{font-size:16px}#checkInTitle{font-size:21px}.stay-day{margin-bottom:28px}.stay-date{display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:19px;margin:0 0 12px}.stay-date span{font-size:12px;font-weight:400;color:var(--muted)}.stay-list{background:#fffefa;border:1px solid var(--line);border-radius:14px;padding:0 18px}.stay-row{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid var(--line)}.stay-row:last-child{border-bottom:0}.stay-info{flex:1;min-width:0;overflow-wrap:anywhere}.stay-info strong{font-size:17px}.stay-info p{margin:5px 0 0}.stay-note{white-space:pre-wrap;font-size:14px;color:var(--muted)}.stay-actions{display:flex;gap:6px;flex-shrink:0}.stay-actions button{padding:8px 10px}@media(max-width:380px){.stay-list{padding:0 12px}.stay-actions{flex-direction:column}.stay-row{gap:8px}}.checkin-date{display:flex;align-items:center;gap:10px}.checkin-date input{flex:1;min-width:0;min-height:46px}.checkin-date button{flex-shrink:0}button.checked-in:disabled{background:#ffe0c2;border-color:#d58a4b;color:#93451f;font-weight:700;opacity:1}.badge.checked-in-badge{background:#ffe0c2;color:#93451f}.card .badge{display:inline-block;background:#f0eae1;color:#857361;border:1px solid #e5dbce;padding:5px 9px;border-radius:7px;font-size:12px;line-height:1.5}.card .complete-badge{background:#f7edcc;color:#897033;border-color:#e8dbaf;border-radius:7px;line-height:1.5}.card .badge.checked-in-badge{background:#f8e6d8;color:#a16843;border-color:#edcfb8}.eaten-control{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 44px;min-height:48px;margin:0;cursor:pointer;gap:3px}.eaten-control input[type=checkbox]{width:22px;height:22px;min-height:22px;margin:0;accent-color:var(--orange)}.eaten-control span{font-size:11px;color:var(--muted)}.stay-row.eaten .stay-info{opacity:.5}.stay-row.eaten .stay-info strong{text-decoration:line-through}.fraction-fields{display:flex;align-items:center;gap:12px}.fraction-fields input{min-width:0}select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-size:16px}.other-eater{display:flex;align-items:center;gap:6px;margin:8px 0;min-height:44px;font-size:13px}.other-eater input{min-height:20px}.month-summary{background:#f4e7d5;border-radius:12px;padding:14px;font-weight:700}.meal-history{font-size:13px;margin-top:8px}.meal-history summary{min-height:44px;cursor:pointer;padding-top:12px}.meal-entry{padding:7px 0}.meal-entry button{font-size:12px;padding:6px}.stay-actions{flex-wrap:wrap;max-width:145px}.stay-row.eaten .other-eater{opacity:1}#eatError{color:#a52d2d;font-size:14px}@media(max-width:600px){.stay-row{flex-wrap:wrap;align-items:flex-start}.stay-info{flex-basis:calc(100% - 60px)}.stay-actions{max-width:none;margin-left:56px}}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;justify-content:center;margin:0 .16em;line-height:1.15;font-size:.85em;text-align:center}.fraction .numerator{border-bottom:1px solid currentColor;padding:0 .18em .1em;min-width:100%}.fraction .denominator{padding:.1em .18em 0}.stay-row{padding:11px 0;gap:9px;align-items:center}.stay-info strong{font-size:16px}.stay-info p{margin:3px 0 0;line-height:1.4}.meal-meta{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;margin-top:3px}.meal-meta>p.small{margin:0}.other-eater{margin:0;min-height:34px;gap:4px;font-size:12px}.other-eater input[type=checkbox]{width:18px;height:18px;min-height:18px}.meal-history{margin:0}.meal-history summary{min-height:34px;padding:8px 0;font-size:12px}.meal-history[open]{flex-basis:100%}.stay-actions{max-width:none;flex-wrap:nowrap;gap:4px}.stay-actions button{padding:8px;font-size:13px}.eaten-control{flex-basis:36px}.stay-list{padding:0 14px}@media(max-width:600px){.stay-row{display:grid;grid-template-columns:32px minmax(0,1fr);gap:2px 8px;padding:10px 0}.eaten-control{grid-column:1;grid-row:1 / 3;align-self:center}.stay-info{grid-column:2;min-width:0}.stay-actions{grid-column:2;margin:0;justify-content:flex-end;gap:5px}.stay-actions button{font-size:12px;padding:6px 10px;min-height:38px}.meal-meta{gap:0 10px}.stay-info strong{font-size:15px}.stay-info .small{font-size:12px}.stay-day{margin-bottom:20px}.stay-date{margin-bottom:8px}.stay-list{padding:0 10px}}</style></head><body>
<header><div class="brand">🥖 麵包日常</div><span class="small">把喜歡的味道，好好記下來。</span></header>
<main><div class="hero"><div><div class="eyebrow">A LITTLE BREAD JOURNAL</div><h1>今天，也有麵包相伴。</h1><p class="small">記錄買到的美味，也整理下一次的期待。</p></div><div class="bread" aria-hidden="true">🥐</div></div>
<nav aria-label="主要功能"><button id="purchasedTab" class="active">已入住麵包</button><button id="listsTab">我的清單</button></nav><section id="content"></section><footer>資料自動儲存在此瀏覽器，不同裝置的資料不會自動同步。</footer></main>
<dialog id="checkInDialog" aria-labelledby="checkInTitle"><h2 id="checkInTitle">確認辦理入住嗎？</h2><p>入住後可在已入住麵包查看這些新房客</p><label for="checkInDate">入住日期</label><div class="checkin-date"><input id="checkInDate" type="date" required></div><div class="checkin-actions"><button id="cancelCheckIn" type="button" autofocus>取消</button><button id="confirmCheckIn" class="primary" type="button">確認入住</button></div></dialog><dialog id="eatDialog"><form id="eatForm"><h2>吃一點 🥯</h2><p id="eatName"></p><label>吃了幾分之幾顆？</label><div class="fraction-fields"><input id="eatNumerator" type="number" inputmode="numeric" min="1" step="1" value="1" required aria-label="分子"><span>／</span><input id="eatDenominator" type="number" inputmode="numeric" min="1" step="1" value="2" required aria-label="分母"></div><label for="eatWho">誰吃的？</label><select id="eatWho"><option value="self">自己吃</option><option value="other">別人吃</option></select><label for="eatDate">食用日期</label><input id="eatDate" type="date" required><p id="eatError" role="alert"></p><div class="checkin-actions"><button id="eatCancel" type="button">取消</button><button class="primary">記錄</button></div></form></dialog><dialog id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><div id="toast" role="status"></div>
<script>
const key='bread-journal-v1';let data={purchased:[],lists:[]},tab='purchased',selected=null,onSave;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('sv-SE');try{let v=JSON.parse(localStorage.getItem(key));if(v&&Array.isArray(v.purchased)&&Array.isArray(v.lists))data=v}catch(e){alert('無法讀取原有資料，請匯入備份或重新開始。')}
function statusOf(i){return ['buy','skip','maybe'].includes(i.status)?i.status:'maybe'}
function totals(items){let total=0,missing=0;for(const i of items){if(statusOf(i)!=='buy')continue;if(i.price==null||i.price===''||i.qty==null||i.qty===''||!Number.isFinite(Number(i.price))||Number(i.price)<0||!Number.isInteger(Number(i.qty))||Number(i.qty)<1){missing++;continue}total+=Math.round(Number(i.price)*100)*Number(i.qty)}return {total:total/100,missing}}
let pendingCheckIn=null;
$('#cancelCheckIn').onclick=()=>$('#checkInDialog').close();$('#checkInDialog').addEventListener('close',()=>{pendingCheckIn=null});$('#confirmCheckIn').onclick=()=>{const date=$('#checkInDate');if(!date.reportValidity())return;const list=pendingCheckIn;const stayDate=date.value;pendingCheckIn=null;$('#checkInDialog').close();if(list)checkIn(list,true,stayDate)};
function checkIn(list,confirmed=false,stayDate=today()){if(list.checkedIn)return;const items=list.items.filter(i=>statusOf(i)==='buy');if(!items.length){toast('先選好要買的麵包，再帶新房客來入住吧！');return}if(!confirmed){pendingCheckIn=list;$('#checkInDate').value=today();$('#checkInDialog').showModal();return}for(const i of items){const count=Number(i.qty)>0?Number(i.qty):1;for(let unit=0;unit<count;unit++)data.purchased.unshift({id:uid(),name:i.name,shop:list.name,date:stayDate,qty:1,note:i.note||'',price:i.price??'',sourceListId:list.id,sourceItemId:i.id})}list.checkedIn=true;save();toast('🛎️ 入住完成！麵包們已住進冷凍庫，等待下次美味登場。')}
function totalMarkup(items){const t=totals(items);return '要買合計：NT＄'+t.total.toLocaleString('zh-TW',{maximumFractionDigits:2})+' 元'+(t.missing?'（'+t.missing+' 項未填單價或數量，尚未計入）':'')}
function sortedItems(items){const rank={buy:0,maybe:1,skip:2};return [...items].sort((a,b)=>rank[statusOf(a)]-rank[statusOf(b)])}
let reorderTimer;
function save(rerender=true){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('儲存失敗，請立即下載完整備份，以免遺失資料。')}if(rerender)render()}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400)}
function modal(title,fields,fn){$('#modalTitle').textContent=title;$('#fields').innerHTML=fields.map(([id,label,value,type='text'])=>type==='textarea'?`<label for="${id}">${label}</label><textarea id="${id}" name="${id}" maxlength="2000" placeholder="例如：取貨時間、訂購提醒…">${esc(value)}</textarea>`:`<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type==='price'?'number':type}" ${type==='price'?'min="0" step="0.01" inputmode="decimal"':''} value="${esc(value)}" ${id==='name'?'required maxlength="100"':''} ${type==='number'?'min="1" max="999" step="1" required':''}>`).join('');onSave=fn;$('#modal').showModal();$('#fields input').focus()}
$('#cancel').onclick=()=>$('#modal').close();$('#form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.name?.trim())return;f.name=f.name.trim();onSave(f);$('#modal').close();save()};
function addBread(existing){modal(existing?'編輯麵包':'加入買到的麵包',[['name','麵包名稱',existing?.name||''],['shop','店家',existing?.shop||''],['date','入住日期',existing?.date||today(),'date'],['qty','數量',existing?.qty||1,'number'],['note','備註／口味',existing?.note||'']],f=>{if(existing)Object.assign(existing,f);else data.purchased.unshift({id:uid(),...f});splitStays()})}
function addList(existing){modal(existing?'編輯清單':'新增清單',[['name','清單名稱（例如：9/20 林氏貝果）',existing?.name||''],['note','清單備註',existing?.note||'','textarea']],f=>{if(existing)Object.assign(existing,f);else data.lists.unshift({id:uid(),name:f.name,note:f.note,items:[]})})}
function addItem(list,item){modal(item?'編輯品項':'加入清單品項',[['name','品項名稱',item?.name||''],['price','單價（元，可留空）',item?.price??'','price'],['note','備註',item?.note||'']],f=>{if(item)Object.assign(item,f);else list.items.push({id:uid(),status:'maybe',qty:'',...f})})}
function remove(arr,id,text){if(confirm(text)){arr.splice(arr.findIndex(x=>x.id===id),1);save()}}
function splitStays(){const result=[];let changed=false;for(const b of data.purchased){const count=Number(b.qty);if(!Number.isInteger(count)||count<=1){result.push(b);continue}changed=true;const units=Array.from({length:count},(_,index)=>({...b,id:index===0?b.id:uid(),qty:1,meals:[],eaten:false}));let unitIndex=0;for(const meal of b.meals||[]){let left=Number(meal.amount);while(left>1e-9&&unitIndex<count){const unit=units[unitIndex],space=1-unit.meals.reduce((s,m)=>s+m.amount,0),amount=Math.min(left,space);if(amount>1e-9)unit.meals.push({...meal,id:uid(),amount,fraction:undefined});left-=amount;if(space-amount<1e-9)unitIndex++}}for(const unit of units)unit.eaten=b.eaten&&!(b.meals||[]).length?true:unit.meals.reduce((s,m)=>s+m.amount,0)>=1-1e-9;result.push(...units)}if(changed){data.purchased=result;save(false)}}
function capacity(b){return Number(b.qty)>0?Number(b.qty):1}
function remaining(b){return Math.max(0,capacity(b)-(b.meals||[]).reduce((s,m)=>s+Number(m.amount),0))}
function amountText(n){if(!Number.isFinite(n))return '0';const sign=n<0?'-':'';n=Math.abs(n);let numerator=0,denominator=1;let x=n,p0=0,p1=1,q0=1,q1=0;for(let k=0;k<40;k++){const a=Math.floor(x),p=a*p1+p0,q=a*q1+q0;if(q>1000000)break;numerator=p;denominator=q;if(Math.abs(n-p/q)<1e-10)break;const rest=x-a;if(rest<1e-12)break;p0=p1;p1=p;q0=q1;q1=q;x=1/rest}const whole=Math.floor(numerator/denominator),remainder=numerator%denominator;if(!remainder)return sign+whole;const fraction=remainder+'/'+denominator;return sign+(whole?whole+' ':'')+fraction}
function fractionMarkup(text){return esc(text).replace(/(\d+)\/(\d+)/g,'<span class="fraction"><span class="numerator">$1</span><span class="denominator">$2</span></span>')}
function amountMarkup(n){return fractionMarkup(amountText(n))}
function monthSummary(){const month=today().slice(0,7);let total=0;for(const b of data.purchased)for(const m of b.meals||[])if(m.who==='self'&&m.date.startsWith(month))total+=Number(m.amount);return month.replace('-',' 年 ')+' 月・自己吃了 '+amountMarkup(total)+' 顆麵包'}
function mealMarkup(b){return '<div class="meal-meta"><p class="small">'+(b.eaten?'已吃完':'剩餘 '+amountMarkup(remaining(b))+' 顆')+(!b.qty?'（未填數量，以 1 顆計）':'')+'</p><label class="other-eater"><input type="checkbox" data-other="'+esc(b.id)+'" '+(b.otherEater?'checked':'')+'>別人吃</label>'+((b.meals||[]).length?'<details class="meal-history"><summary>食用紀錄（'+b.meals.length+'）</summary>'+b.meals.map(m=>'<div class="meal-entry">'+esc(m.date)+' · '+(m.who==='self'?'自己':'別人')+'吃 '+amountMarkup(Number(m.amount))+' 顆 <button data-bread="'+esc(b.id)+'" data-undo-meal="'+esc(m.id)+'">撤銷</button></div>').join('')+'</details>':'')+'</div>'}
let eatingBread=null;
function openEat(b){eatingBread=b;$('#eatName').innerHTML=esc(b.name)+' · 剩餘 '+amountMarkup(remaining(b))+' 顆';$('#eatNumerator').value=1;$('#eatDenominator').value=2;$('#eatWho').value=b.otherEater?'other':'self';$('#eatDate').value=today();$('#eatError').textContent='';$('#eatDialog').showModal()}
$('#eatCancel').onclick=()=>$('#eatDialog').close();$('#eatForm').onsubmit=e=>{e.preventDefault();const b=eatingBread,n=Number($('#eatNumerator').value),d=Number($('#eatDenominator').value),amount=n/d;if(!b||!Number.isInteger(n)||!Number.isInteger(d)||n<=0||d<=0||amount>remaining(b)+1e-9){$('#eatError').textContent='請填有效分數，食用份量不能超過剩餘份量。';return}b.meals??=[];b.meals.push({id:uid(),amount,fraction:n+'/'+d,who:$('#eatWho').value,date:$('#eatDate').value});b.eaten=remaining(b)<1e-9;$('#eatDialog').close();save()};
function stayMarkup(){const groups=new Map();for(const b of data.purchased){const date=b.date||'';if(!groups.has(date))groups.set(date,[]);groups.get(date).push(b)}return [...groups.keys()].sort((a,b)=>b.localeCompare(a)).map(date=>`<section class="stay-day"><h3 class="stay-date">${esc(date||'日期未填')}<span>${groups.get(date).length} 款麵包入住</span></h3><div class="stay-list">${[...groups.get(date)].sort((a,b)=>Number(!!a.eaten)-Number(!!b.eaten)).map(b=>`<article class="stay-row ${b.eaten?'eaten':''}"><label class="eaten-control"><input type="checkbox" data-eaten="${esc(b.id)}" ${b.eaten?'checked':''} aria-label="${esc(b.name)} 已吃完"><span>吃完</span></label><div class="stay-info"><strong>${esc(b.name)}</strong><p class="small">${esc(b.shop||'未填店家')} · ${b.qty?esc(b.qty)+' 個':'數量未填'}</p>${b.note?'<p class="stay-note">'+esc(b.note)+'</p>':''}${mealMarkup(b)}</div><div class="stay-actions"><button data-eat="${esc(b.id)}" ${b.eaten?'disabled':''}>吃一點</button><button data-edit="${esc(b.id)}">編輯</button><button data-delete="${esc(b.id)}">刪除</button></div></article>`).join('')}</div></section>`).join('')}
function render(){splitStays(); $('#purchasedTab').classList.toggle('active',tab==='purchased');$('#listsTab').classList.toggle('active',tab==='lists');let c=$('#content');if(tab==='purchased'){c.innerHTML=`<div class="toolbar"><div><h2>已入住麵包</h2><p class="small">共 ${data.purchased.length} 個麵包</p></div><button class="primary" id="add">＋ 加入麵包</button></div><p class="month-summary">${monthSummary()}</p><div class="stay-groups">${data.purchased.length?stayMarkup():'<div class="empty">🥐<strong>還沒有麵包入住</strong>從清單辦理入住，或點「加入麵包」登記新房客。</div>'}</div>`;$('#add').onclick=()=>addBread();c.querySelectorAll('[data-eaten]').forEach(b=>b.onchange=()=>{const item=data.purchased.find(x=>x.id===b.dataset.eaten);item.meals??=[];if(b.checked){const amount=remaining(item);if(amount>0)item.meals.push({id:uid(),amount,who:item.otherEater?'other':'self',date:today(),completion:true});item.eaten=true}else{item.meals=item.meals.filter(m=>!m.completion);item.eaten=false}save()});c.querySelectorAll('[data-other]').forEach(b=>b.onchange=()=>{const item=data.purchased.find(x=>x.id===b.dataset.other);item.otherEater=b.checked;for(const m of item.meals||[])if(m.completion)m.who=b.checked?'other':'self';save()});c.querySelectorAll('[data-eat]').forEach(b=>b.onclick=()=>openEat(data.purchased.find(x=>x.id===b.dataset.eat)));c.querySelectorAll('[data-undo-meal]').forEach(b=>b.onclick=()=>{const item=data.purchased.find(x=>x.id===b.dataset.bread);item.meals=item.meals.filter(m=>m.id!==b.dataset.undoMeal);item.eaten=remaining(item)<=0;save()});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>addBread(data.purchased.find(x=>x.id===b.dataset.edit)));c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(data.purchased,b.dataset.delete,'確定刪除這筆麵包紀錄？'));return}
let l=data.lists.find(x=>x.id===selected);if(l){c.innerHTML=`<button class="back" id="back">← 所有清單</button><div class="toolbar"><div><h2>${esc(l.name)}</h2>${l.note?`<p class="list-note">${esc(l.note)}</p>`:''}<p class="small">共 ${l.items.length} 項 · ${l.items.filter(i=>statusOf(i)==='buy').length} 項要買</p><div class="purchase-summary"><p class="total" id="listTotal">${esc(totalMarkup(l.items))}</p><button class="complete-button" id="complete" aria-pressed="${!!l.completed}">${l.completed?'✓ 購買完成':'購買完成'}</button><button id="checkIn" class="${l.checkedIn?'checked-in':''}" ${l.checkedIn?'disabled':''}>${l.checkedIn?'✓ 已入住':'入住'}</button></div></div><button class="primary" id="add">＋ 加入品項</button></div><div class="card">${l.items.length?sortedItems(l.items).map(i=>`<div class="row"><div class="item-head"><div class="name"><strong>${esc(i.name)}</strong><div class="small">${esc(i.note||'')}</div></div><button class="icon" data-edit="${i.id}" aria-label="編輯 ${esc(i.name)}">編輯</button><button class="icon" data-delete="${i.id}" aria-label="刪除 ${esc(i.name)}">×</button></div><div class="item-options"><div class="choices" role="group" aria-label="${esc(i.name)} 購買意願">${[['buy','要買'],['maybe','考慮'],['skip','不買']].map(([value,label])=>`<label class="choice"><input type="radio" name="status-${i.id}" value="${value}" data-status="${i.id}" ${statusOf(i)===value?'checked':''}><span>${label}</span></label>`).join('')}</div><label class="quantity">數量<input class="item-qty" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="未填" value="${esc(i.qty||'')}" data-qty="${i.id}" aria-label="${esc(i.name)} 數量"></label><label class="quantity price-field">單價（元）<input class="item-price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="未填" value="${esc(i.price??'')}" data-price="${i.id}" aria-label="${esc(i.name)} 單價"></label></div></div>`).join(''):'<div class="empty"><strong>清單準備好了</strong>先加入品項，再選擇要不要買與填寫數量。</div>'}</div><p><button id="rename">編輯清單</button></p>`;$('#complete').onclick=()=>{l.completed=!l.completed;save()};$('#checkIn').onclick=()=>checkIn(l);$('#back').onclick=()=>{selected=null;render()};$('#add').onclick=()=>addItem(l);$('#rename').onclick=()=>addList(l);c.querySelectorAll('[data-status]').forEach(b=>b.onchange=()=>{l.items.find(i=>i.id===b.dataset.status).status=b.value;save(false);$('#listTotal').textContent=totalMarkup(l.items);toast('已更新，稍後調整排序');clearTimeout(reorderTimer);reorderTimer=setTimeout(()=>{if(document.activeElement?.matches('.item-qty,.item-price')){document.activeElement.addEventListener('blur',()=>render(),{once:true});return}render()},600)});c.querySelectorAll('[data-price]').forEach(b=>b.onchange=()=>{if(!b.checkValidity()){b.reportValidity();return}l.items.find(i=>i.id===b.dataset.price).price=b.value;save(false);$('#listTotal').textContent=totalMarkup(l.items)});c.querySelectorAll('[data-qty]').forEach(b=>b.onchange=()=>{if(!b.checkValidity()){b.reportValidity();return}l.items.find(i=>i.id===b.dataset.qty).qty=b.value;save(false);$('#listTotal').textContent=totalMarkup(l.items)});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>addItem(l,l.items.find(x=>x.id===b.dataset.edit)));c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(l.items,b.dataset.delete,'確定刪除這個品項？'));return}
c.innerHTML=`<div class="toolbar"><div><h2>我的清單</h2><p class="small">每一次想吃的，都有自己的位置。</p></div><button class="primary" id="add">＋ 新增清單</button></div><div class="grid">${data.lists.length?data.lists.map(l=>`<article class="card"><span class="badge">麵包清單</span> ${l.completed?'<span class="complete-badge">✓ 購買完成</span>':''} ${l.checkedIn?'<span class="badge checked-in-badge">✓ 已入住</span>':''}<h3>${esc(l.name)}</h3>${l.note?`<p class="list-note">${esc(l.note)}</p>`:''}<p class="small">${l.items.length} 個品項 · ${l.items.filter(i=>statusOf(i)==='buy').length} 項要買</p><div class="actions"><button class="primary" data-open="${l.id}">查看清單 →</button><button data-delete="${l.id}">刪除</button></div></article>`).join(''):'<div class="empty">📝<strong>替下一次的麵包留個位置</strong>新增「9/20 林氏貝果」這樣的清單，再慢慢加入品項。</div>'}</div>`;$('#add').onclick=()=>addList();c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;render()});c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(data.lists,b.dataset.delete,'確定刪除整份清單及所有品項？'))}
$('#purchasedTab').onclick=()=>{tab='purchased';selected=null;render()};$('#listsTab').onclick=()=>{tab='lists';selected=null;render()};render();
</script></body></html>
